name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.tag.outputs.version }}$" | head -n 1)

          if [ -z "$PREVIOUS_TAG" ]; then
            # First release — include all commits
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log "${PREVIOUS_TAG}..${{ steps.tag.outputs.version }}" --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Write to file to avoid escaping issues
          echo "$LOG" > changelog.txt
          echo "Generated changelog from ${PREVIOUS_TAG:-'initial commit'} to ${{ steps.tag.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          body_path: changelog.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true

  publish:
    name: Publish to Maven Central
    needs: release
    # Use macOS to build ALL targets including iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build library
        run: ./gradlew :kmp-loading-animation:assemble --no-configuration-cache

      - name: Decode signing key
        run: |
          # Decode the base64-encoded key into the armored PGP format
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > /tmp/signing_key.asc
          echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF" >> $GITHUB_ENV
          cat /tmp/signing_key.asc >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          rm /tmp/signing_key.asc

      - name: Publish to Maven Central
        run: ./gradlew :kmp-loading-animation:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Summary
        run: |
          echo "## Published to Maven Central" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ needs.release.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifact will appear at https://central.sonatype.com/artifact/io.github.akimaleo/kmp-loading-animation within ~15-30 minutes." >> $GITHUB_STEP_SUMMARY
